<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675"><rect width="1200" height="675" rx="24" fill="#0b101a"/><g font-family="Arial,sans-serif" fill="#f8fafc"><text x="70" y="115" font-size="40" font-weight="700">ONE SKILL. ONE ROUND. ONE ADJUSTMENT.</text><text x="70" y="160" font-size="21" fill="#94a3b8">An editorial practice loop, not a game menu or a measured combo.</text><g font-size="28" font-weight="700"><text x="85" y="326">01 / OBSERVE</text><text x="455" y="326">02 / PRACTICE</text><text x="825" y="326">03 / REVIEW</text></g><g font-size="20" fill="#cbd5e1"><text x="85" y="375">Identify one input.</text><text x="85" y="410">Watch one attack.</text><text x="455" y="375">Test it against AI.</text><text x="455" y="410">Change one variable.</text><text x="825" y="375">Compare the outcome.</text><text x="825" y="410">Choose the next goal.</text></g></g><g stroke="#ef4444" stroke-width="4"><path d="M85 270h250m120 0h250m120 0h250"/><path d="M355 380h60m-15-12 15 12-15 12M725 380h60m-15-12 15 12-15 12" fill="none"/></g><text x="70" y="595" fill="#94a3b8" font-family="Arial,sans-serif" font-size="18">FIRST PERSON BOXING HUB / ORIGINAL EDITORIAL DIAGRAM</text></svg>
